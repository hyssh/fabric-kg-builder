      competency_question_ids: ["cq:q1", "cq:q2", "cq:q4"]
      governance_rationale: Required by approved facility-maintenance questions.
      tombstoned: false
    - type_id: semantic-type:facility-maintenance.work-order
      semantic_key: work-order
      display_name: Work Order
      description: An authorized maintenance task.
      aliases: []
      classification: domain
      parent_type_id: null
      abstract: false
      identity_root_type_id: semantic-type:facility-maintenance.work-order
      identity_key_policy: {authority: user_approved, namespace: facility-maintenance.work-order, key_mode: business_key, business_key_fields: [work_order_id], normalization_version: "1", collision_behavior: block, missing_key_behavior: unresolved, type_independent: true}
