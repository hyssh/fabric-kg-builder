      parent_type_id: null
      abstract: false
      identity_root_type_id: semantic-type:facility-maintenance.facility
      identity_key_policy: {authority: user_approved, namespace: facility-maintenance.facility, key_mode: business_key, business_key_fields: [facility_id], normalization_version: "1", collision_behavior: block, missing_key_behavior: unresolved, type_independent: true}
