schema_version: "2.0"
domain:
  name: Facility Maintenance
  description: Models facilities, installed equipment, and maintenance work orders.
  subdomains: [asset operations]
business:
  organization_context: A facilities team operates buildings and maintains installed equipment.
  users: [facility manager, maintenance planner]
  decisions: [Prioritize maintenance work by facility and equipment.]
problem:
  statement: Connect facilities, equipment, and work orders with evidence-backed relationships.
  desired_outcomes: [Trace maintenance work to installed equipment and its facility.]
  in_scope: [equipment, facilities, work orders]
  out_of_scope: [autonomous equipment control]
competency_questions:
  - {id: "cq:q1", question: "Which facility contains a specified equipment asset?", business_critical: true}
  - {id: "cq:q2", question: "Which equipment assets are installed in a facility?", business_critical: true}
  - {id: "cq:q3", question: "Which equipment asset is addressed by a work order?", business_critical: true}
  - {id: "cq:q4", question: "Which work orders affect equipment in a facility?", business_critical: true}
  - {id: "cq:q5", question: "Which work orders have been recorded for an equipment asset?", business_critical: true}
terminology:
  canonical_terms:
    - term: work order
      definition: A maintenance task authorized for a specific equipment asset.
      synonyms: [maintenance order]
  ambiguous_terms: []
candidate_model:
  entity_types:
    - type_id: semantic-type:facility-maintenance.equipment
      semantic_key: equipment
      display_name: Equipment
      description: An installed maintainable asset.
      aliases: []
      classification: domain
      parent_type_id: null
      abstract: false
      identity_root_type_id: semantic-type:facility-maintenance.equipment
      identity_key_policy: {authority: user_approved, namespace: facility-maintenance.equipment, key_mode: business_key, business_key_fields: [equipment_id], normalization_version: "1", collision_behavior: block, missing_key_behavior: unresolved, type_independent: true}
      declared_properties: []
