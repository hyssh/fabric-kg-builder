      sibling_classification_policy: &sibling_policy {mode: unresolved, discriminator_property_id: null, rationale: Ambiguous sibling observations remain unresolved.}
      generalization_basis: null
      evidence_span_ids: []
      competency_question_ids: ["cq:q1", "cq:q2", "cq:q3", "cq:q4", "cq:q5"]
      governance_rationale: Required by approved facility-maintenance questions.
      tombstoned: false
    - type_id: semantic-type:facility-maintenance.facility
