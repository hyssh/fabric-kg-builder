      generalization_basis: null
      evidence_span_ids: []
      competency_question_ids: ["cq:q3", "cq:q4", "cq:q5"]
      governance_rationale: Required by approved facility-maintenance questions.
      tombstoned: false
  relationship_types:
    - relationship_type_id: relationship-type:facility-maintenance.contains
      predicate_id: predicate:facility-maintenance.contains
      display_name: contains
      description: A facility contains installed equipment.
      source_type_ids: [semantic-type:facility-maintenance.facility]
      target_type_ids: [semantic-type:facility-maintenance.equipment]
      direction: source_to_target
      endpoint_policy: allow_subtypes
      evidence_policy: exact_span_required
      publication_policy: asserted_only
      identity_policy: &relationship_identity
        seed_fields: [predicate_id, source_entity_id, target_entity_id, governed_context]
        excludes_display_labels: true
        excludes_endpoint_type_labels: true
        context_policy: approved maintenance context
      competency_question_ids: ["cq:q1", "cq:q2", "cq:q4"]
      governance_rationale: Required by approved facility-maintenance questions.
      evidence_span_ids: []
    - relationship_type_id: relationship-type:facility-maintenance.work-order-for
      predicate_id: predicate:facility-maintenance.work-order-for
      display_name: work order for
      description: A work order applies to equipment.
      source_type_ids: [semantic-type:facility-maintenance.work-order]
      target_type_ids: [semantic-type:facility-maintenance.equipment]
      direction: source_to_target
      endpoint_policy: allow_subtypes
      evidence_policy: exact_span_required
      publication_policy: asserted_only
      identity_policy: *relationship_identity
      competency_question_ids: ["cq:q3", "cq:q4", "cq:q5"]
      governance_rationale: Required by approved facility-maintenance questions.
      evidence_span_ids: []
constraints:
  temporal: [Preserve work-order effective dates.]
  regulatory: []
  privacy: []
  safety: [Do not initiate maintenance actions automatically.]
examples:
  positive:
    - text: Work order WO-17 applies to air handler AHU-4 in Building A.
      expected: [Work Order work order for Equipment]
  negative:
    - text: Automatically shut down AHU-4.
      reason: Autonomous equipment control is outside the approved scope.
