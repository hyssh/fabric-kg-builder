[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-kg-builder"
version = "0.2.3"
description = "CLI tool to build and deploy knowledge graphs to Microsoft Fabric"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyarrow>=14.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "azure-core>=1.30",
    "azure-identity>=1.15",
    "azure-search-documents>=11.4",
    "azure-storage-blob>=12.19",
    "azure-ai-documentintelligence>=1.0",
    "deltalake>=1.6",
    "requests>=2.31",
    "pillow>=10.0",
    "python-pptx>=0.6.23",
    "tiktoken>=0.7",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3",
]
agent = [
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.15",
]
app = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
]
ui = [
    "chainlit>=1.0",
]

[project.scripts]
fabric-kg = "fabric_kg_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run: fast unit + contract tests only.  slow/integration are opt-in.
# Override with:  pytest -m integration   pytest -m slow   pytest -m ""
# --cov-fail-under is intentionally ABSENT here; CI publishes coverage reports
# without enforcing a hard global threshold.
addopts = "--cov=fabric_kg_builder --cov-report=term-missing -m 'not slow and not integration'"
markers = [
    "unit: pure-function tests, no I/O (fast, no network)",
    "contract: schema-conformance tests, fixture data only",
    "integration: full-pipeline tests that read real sample_data files (opt-in)",
    "offline: integration-scale tests that make no external network calls",
    "slow: tests that take >2 s — real PDFs, large fixtures (opt-in, implies integration)",
    "smoke: post-deploy live-environment checks (not part of merge gate)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
# Targets per SPEC-005 §9: 80-90% on core modules.
show_missing = true
skip_covered = false
